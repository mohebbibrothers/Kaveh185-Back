services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kaveh185
      POSTGRES_USER: kaveh185
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kaveh185_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaveh185"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_kaveh185 &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4"
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-kaveh185-docker-secret-key-change-in-production-1234567890}
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: kaveh185
      DB_USER: kaveh185
      DB_PASSWORD: ${DB_PASSWORD:-kaveh185_dev_password}
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      SECURE_SSL_REDIRECT: "False"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build: .
    restart: unless-stopped
    command: celery -A config worker --loglevel=info --concurrency=2
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-kaveh185-docker-secret-key-change-in-production-1234567890}
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: kaveh185
      DB_USER: kaveh185
      DB_PASSWORD: ${DB_PASSWORD:-kaveh185_dev_password}
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
