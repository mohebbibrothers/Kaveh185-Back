          type: integer
        description: حداکثر تعداد پاسخ درست
      - in: query
        name: max_duration
        schema:
          type: integer
        description: حداکثر مدت زمان آزمون (ثانیه)
      - in: query
        name: max_score
        schema:
          type: number
          format: double
        description: حداکثر امتیاز کل نهایی
      - in: query
        name: max_unanswered
        schema:
          type: integer
        description: حداکثر تعداد سوالات بی‌پاسخ
      - in: query
        name: max_wrong
        schema:
          type: integer
        description: حداکثر تعداد پاسخ غلط
      - in: query
        name: min_age
        schema:
          type: integer
        description: حداقل سن شرکت‌کننده به سال (مثلاً `12`)
      - in: query
        name: min_correct
        schema:
          type: integer
        description: حداقل تعداد پاسخ درست
      - in: query
        name: min_duration
        schema:
          type: integer
        description: حداقل مدت زمان آزمون (ثانیه)
      - in: query
        name: min_score
        schema:
          type: number
          format: double
        description: حداقل امتیاز کل نهایی
      - in: query
        name: min_unanswered
        schema:
          type: integer
        description: حداقل تعداد سوالات بی‌پاسخ
      - in: query
        name: min_wrong
        schema:
          type: integer
        description: حداقل تعداد پاسخ غلط
      - in: query
        name: mosque_id
        schema:
          type: integer
        description: فیلتر شناسه تک‌مسجد
      - in: query
        name: mosque_ids
        schema:
          type: string
        description: فیلتر یک یا چند مسجد هم‌زمان با کاما (مثلاً `1,3,7`)
      - in: query
