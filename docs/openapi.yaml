openapi: 3.0.3
info:
  title: Kaveh185 Competition & Cultural Mobilization API
  version: 1.0.0
  description: مستندات جامع API بک‌اند سامانه مسابقه بزرگ فرهنگی و کتابخوانی هفته
    بسیج — حوزه مقاومت بسیج ۱۸۵ شهید کاوه (پوشش ۱۷ مسجد، آزمون ۵ سواله چهارگزینه‌ای
    تصادفی، کارنامه بدون افشای کلید، رتبه‌بندی زنده مساجد و کاوشگر قرعه‌کشی حضوری)
paths:
  /api/v1/:
    get:
      operationId: api_v1_discovery_retrieve
      description: برگرداندن نقشهٔ مسیرهای کلیدی عمومی، شرکت‌کننده، ادمین و مستندات
        Swagger/ReDoc.
      summary: کاتالوگ کشف اندپوینت‌ها و مستندات سامانه کاوه ۱۸۵ (API Discovery)
      tags:
      - System & Health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/admin/command-center/:
    get:
      operationId: admin_command_center_retrieve
      description: بازگرداندن خلاصهٔ کامل عملیاتی، آماری و امنیتی سامانه.
      summary: نمای یکپارچه مرکز فرماندهی ادمین در یک درخواست
      tags:
      - Admin - Command Center
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandCenterSnapshot'
          description: ''
  /api/v1/admin/command-center/overview/:
    get:
      operationId: admin_command_center_overview_retrieve
      description: بازگرداندن خلاصهٔ کامل عملیاتی، آماری و امنیتی سامانه.
      summary: نمای یکپارچه مرکز فرماندهی ادمین در یک درخواست
      tags:
      - Admin - Command Center
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandCenterSnapshot'
          description: ''
  /api/v1/audit-logs/admin/logs/:
    get:
      operationId: audit_logs_admin_logs_list
      description: واکشی و صفحه‌بندی لاگ‌های حسابرسی.
      summary: فهرست لاگ‌های حسابرسی (مخصوص ادمین)
      tags:
      - Admin - Audit & Forensics
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditLog'
          description: ''
  /api/v1/audit-logs/admin/logs/{audit_log_id}/:
    get:
      operationId: audit_logs_admin_logs_retrieve
      description: واکشی رکورد حسابرسی با شناسه.
      summary: دریافت جزئیات یک لاگ حسابرسی
      parameters:
      - in: path
        name: audit_log_id
        schema:
          type: integer
        required: true
      tags:
      - Admin - Audit & Forensics
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLog'
          description: ''
  /api/v1/audit-logs/admin/logs/export/:
    get:
      operationId: audit_logs_admin_logs_export_retrieve
      description: تولید بستهٔ فارنزیک و ثبت رخداد خروجی در زنجیرهٔ حسابرسی.
      summary: خروجی بستهٔ فارنزیک لاگ‌های حسابرسی
      tags:
      - Admin - Audit & Forensics
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: ''
  /api/v1/audit-logs/admin/logs/verify/:
    get:
      operationId: audit_logs_admin_logs_verify_retrieve
      description: اجرای بررسی پیوستگی زنجیرهٔ هش.
      summary: بررسی سلامت و عدم دستکاری زنجیرهٔ هش حسابرسی
      tags:
      - Admin - Audit & Forensics
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditChainVerification'
          description: ''
  /api/v1/auth/admin/risk-signals/:
    get:
      operationId: auth_admin_risk_signals_list
      description: واکشی سیگنال‌های ریسک.
      summary: فهرست سیگنال‌های ریسک امنیتی و ضدتقلب
      tags:
      - Admin - Users & Security
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuthRiskSignal'
          description: ''
  /api/v1/auth/admin/risk-signals/{signal_id}/review/:
    post:
      operationId: auth_admin_risk_signals_review_create
      description: علامت‌گذاری سیگنال ریسک به‌عنوان بررسی‌شده.
      summary: ثبت نتیجهٔ بررسی سیگنال ریسک توسط ادمین
      parameters:
      - in: path
        name: signal_id
        schema:
          type: integer
        required: true
      tags:
      - Admin - Users & Security
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RiskReviewInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RiskReviewInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RiskReviewInputRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthRiskSignal'
          description: ''
  /api/v1/auth/admin/users/:
    get:
      operationId: auth_admin_users_list
      description: واکشی کاربران با فیلتر نقش، مسجد و جست‌وجو.
      summary: فهرست کاربران و شرکت‌کنندگان (مخصوص ادمین)
      tags:
      - Admin - Users & Security
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserProfileOutput'
          description: ''
  /api/v1/auth/admin/users/{user_id}/:
    get:
      operationId: auth_admin_users_retrieve
      description: دریافت اطلاعات کاربر و وضعیت آزمون او.
      summary: مشاهدهٔ اطلاعات کامل یک کاربر توسط ادمین
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - Admin - Users & Security
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileOutput'
          description: ''
    patch:
      operationId: auth_admin_users_partial_update
      description: به‌روزرسانی اطلاعات کاربر توسط ادمین.
      summary: ویرایش اطلاعات یا نقش کاربر توسط ادمین
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - Admin - Users & Security
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserUpdateInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserUpdateInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserUpdateInputRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileOutput'
          description: ''
    delete:
      operationId: auth_admin_users_destroy
      description: غیرفعال‌سازی کاربر و بستن تمام نشست‌های فعال او.
      summary: غیرفعال‌سازی حساب کاربر و ابطال نشست‌های او توسط ادمین
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - Admin - Users & Security
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: ''
  /api/v1/auth/admin/users/{user_id}/sessions/:
    get:
      operationId: auth_admin_users_sessions_list
      description: برگرداندن لیست نشست‌های فعال کاربر هدف.
      summary: مشاهدهٔ نشست‌های فعال یک کاربر توسط ادمین
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - Admin - Users & Security
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuthSessionOutput'
          description: ''
  /api/v1/auth/admin/users/{user_id}/sessions/revoke-all/:
    post:
      operationId: auth_admin_users_sessions_revoke_all_create
      description: بستن فوری تمام نشست‌های فعال کاربر هدف.
      summary: ابطال تمامی نشست‌های یک کاربر توسط ادمین
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - Admin - Users & Security
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: ''
  /api/v1/auth/login/password/:
    post:
      operationId: auth_login_password_create
      description: احراز هویت با رمز عبور و صدور نشست.
      summary: ورود با رمز عبور (مخصوص ادمین و اپراتورها)
      tags:
      - Authentication & Identity
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordLoginInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordLoginInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordLoginInputRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileOutput'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: ابطال نشست جاری و حذف کوکی‌های احراز هویت.
      summary: خروج از حساب و ابطال نشست جاری
      tags:
      - Authentication & Identity
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: ''
  /api/v1/auth/logout-all/:
    post:
      operationId: auth_logout_all_create
      description: ابطال تمام نشست‌های فعال کاربر.
      summary: خروج از تمامی دستگاه‌ها (Revoke All Sessions)
      tags:
      - Authentication & Identity
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: ''
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: برگرداندن پروفایل کاربر و وضعیت دقیق `exam_eligibility`.
      summary: دریافت اطلاعات هویتی، مسجد انتخابی و وضعیت دکمهٔ ورود به آزمون
      tags:
      - Authentication & Identity
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileOutput'
          description: ''
    patch:
      operationId: auth_me_partial_update
      description: به‌روزرسانی نام، تاریخ تولد یا مسجد انتخابی قبل از شروع آزمون.
      summary: ویرایش اطلاعات پروفایل و مسجد (فقط تا پیش از شروع آزمون)
      tags:
      - Authentication & Identity
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateInputRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileOutput'
          description: ''
  /api/v1/auth/mfa/totp/confirm/:
    post:
      operationId: auth_mfa_totp_confirm_create
      description: فعال‌سازی MFA پس از بررسی کد ۶ رقمی.
      summary: تأیید کد TOTP و دریافت کدهای بازیابی یک‌بارمصرف
      tags:
      - Authentication & Identity
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MFACodeInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MFACodeInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MFACodeInputRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: ''
  /api/v1/auth/mfa/totp/setup/:
    post:
      operationId: auth_mfa_totp_setup_create
      description: تولید راز Base32 و URI استاندارد Authenticator.
      summary: تولید راز و لینک QR برای راه‌اندازی TOTP دومرحله‌ای
      tags:
      - Authentication & Identity
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: ''
  /api/v1/auth/mfa/verify/:
    post:
      operationId: auth_mfa_verify_create
      description: بررسی کد MFA و ثبت زمان تأیید تازه روی نشست جاری.
      summary: تأیید کد TOTP/بازیابی برای عملیات حساس (Step-Up MFA)
      tags:
      - Authentication & Identity
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MFACodeInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MFACodeInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MFACodeInputRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: ''
  /api/v1/auth/otp/request/:
    post:
      operationId: auth_otp_request_create
      description: ایجاد چالش OTP و ارسال پیامک (با پاسخ یکسان جهت جلوگیری از شمارش
        کاربران).
      summary: درخواست ارسال کد تایید پیامکی (OTP)
      tags:
      - Authentication & Identity
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPRequestInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OTPRequestInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OTPRequestInputRequest'
        required: true
      security:
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                type: object
          description: ''
  /api/v1/auth/otp/verify/:
    post:
      operationId: auth_otp_verify_create
      description: بررسی کد OTP و صدور توکن‌های JWT مقید به نشست.
      summary: تأیید کد OTP و دریافت توکن نشست
      tags:
      - Authentication & Identity
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPVerifyInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OTPVerifyInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OTPVerifyInputRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileOutput'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: auth_register_create
      description: ثبت اطلاعات هویتی، بررسی یکتایی کدملی و شماره تماس، و صدور نشست
        یا ارسال OTP.
      summary: ثبت‌نام شرکت‌کننده، انتخاب مسجد و آماده‌سازی ورود به آزمون
      tags:
      - Authentication & Identity
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParticipantRegistrationInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ParticipantRegistrationInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ParticipantRegistrationInputRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileOutput'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileOutput'
          description: ''
  /api/v1/auth/sessions/:
    get:
      operationId: auth_sessions_list
      description: برگرداندن لیست نشست‌های فعال کاربر با مشخص کردن نشست فعلی.
      summary: فهرست نشست‌ها و دستگاه‌های فعال من
      tags:
      - Authentication & Identity
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuthSessionOutput'
          description: ''
  /api/v1/auth/sessions/{session_id}/revoke/:
    post:
      operationId: auth_sessions_revoke_create
      description: ابطال نشست مشخص‌شده.
      summary: لغو یک نشست فعال با شناسه
      parameters:
      - in: path
        name: session_id
        schema:
          type: string
        required: true
      tags:
      - Authentication & Identity
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionOutput'
          description: ''
  /api/v1/auth/signup/:
    post:
      operationId: auth_signup_create
      description: هدایت به ثبت‌نام اصلی همراه با درج هدرهای Deprecation و Link.
      summary: مسیر قدیمی ثبت‌نام (Deprecated — از /api/v1/auth/register/ استفاده
        کنید)
      tags:
      - Authentication & Identity
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParticipantRegistrationInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ParticipantRegistrationInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ParticipantRegistrationInputRequest'
        required: true
      security:
      - {}
      deprecated: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileOutput'
          description: ''
  /api/v1/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: صدور توکن Access جدید پس از بررسی عدم ابطال نشست.
      summary: تمدید توکن دسترسی (Refresh Token)
      tags:
      - Authentication & Identity
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshInputRequest'
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: ''
  /api/v1/command-center/:
    get:
      operationId: command_center_retrieve
      description: بازگرداندن خلاصهٔ کامل عملیاتی، آماری و امنیتی سامانه.
      summary: نمای یکپارچه مرکز فرماندهی ادمین در یک درخواست
      tags:
      - Admin - Command Center
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandCenterSnapshot'
          description: ''
  /api/v1/command-center/overview/:
    get:
      operationId: command_center_overview_retrieve
      description: بازگرداندن خلاصهٔ کامل عملیاتی، آماری و امنیتی سامانه.
      summary: نمای یکپارچه مرکز فرماندهی ادمین در یک درخواست
      tags:
      - Admin - Command Center
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandCenterSnapshot'
          description: ''
  /api/v1/core/:
    get:
      operationId: core_retrieve
      description: برگرداندن متادیتای زمان اجرای سامانه.
      summary: دریافت متادیتای سرویس و نسخهٔ قرارداد API
      tags:
      - System & Health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceMetaResponse'
          description: ''
  /api/v1/core/bootstrap/:
    get:
      operationId: core_bootstrap_retrieve
