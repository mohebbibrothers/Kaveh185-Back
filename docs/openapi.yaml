      description: ساختار خروجی وضعیت عمومی و بازهٔ زمانی شرکت در آزمون.
      properties:
        title:
          type: string
        book_title:
          type: string
        organizer_name:
          type: string
        description:
          type: string
        window_state:
          type: string
        window_state_label:
          type: string
        can_participate:
          type: boolean
        status_message:
          type: string
        server_time:
          type: string
        server_time_jalali:
          type: string
        starts_at:
          type: string
        starts_at_jalali:
          type: string
        ends_at:
          type: string
        ends_at_jalali:
          type: string
        seconds_until_start:
          type: integer
        seconds_until_end:
          type: integer
        duration_seconds:
          type: integer
        questions_per_attempt:
          type: integer
        require_otp_before_exam:
          type: boolean
        active_question_bank_size:
          type: integer
        communication_channels:
          type: array
          items: {}
      required:
      - active_question_bank_size
      - book_title
      - can_participate
      - communication_channels
      - description
      - duration_seconds
      - ends_at
      - ends_at_jalali
      - organizer_name
      - questions_per_attempt
      - require_otp_before_exam
      - seconds_until_end
      - seconds_until_start
      - server_time
      - server_time_jalali
      - starts_at
      - starts_at_jalali
      - status_message
      - title
      - window_state
      - window_state_label
    QuestionOptionSafe:
      type: object
      description: گزینهٔ تصادفی‌شدهٔ سوال برای شرکت‌کننده (بدون افشای شناسهٔ اصلی
        یا صحیح بودن).
      properties:
        position:
          type: integer
        text:
          type: string
      required:
      - position
      - text
    ReportCardOutput:
      type: object
      description: ساختار کارنامهٔ نهایی شرکت‌کننده (فقط آمار کلی بدون افشای درست/غلط
        بودن تک‌تک سوالات).
      properties:
        tracking_code:
          type: string
        receipt_signature:
          type: string
        participant:
          type: object
          additionalProperties: {}
        summary:
          type: object
          additionalProperties: {}
        thank_you_message:
          type: string
        communication_channels:
          type: array
          items: {}
      required:
      - communication_channels
      - participant
      - receipt_signature
      - summary
      - thank_you_message
      - tracking_code
    RiskReviewInputRequest:
      type: object
      description: ورودی ثبت یادداشت بررسی سیگنال ریسک توسط ادمین.
      properties:
        review_note:
          type: string
          default: ''
          maxLength: 300
    SMSDeliveryLog:
      type: object
      description: ساختار خروجی لاگ تحویل پیامک برای پنل ادمین.
      properties:
        id:
          type: integer
          readOnly: true
        recipient_phone:
          type: string
          title: شماره موبایل گیرنده
          maxLength: 15
        category:
          allOf:
          - $ref: '#/components/schemas/CategoryEnum'
          title: نوع پیامک
        provider:
          type: string
          title: درگاه پیامکی
          maxLength: 32
        message_text:
          type: string
          title: متن پیامک
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          title: وضعیت ارسال
        provider_message_id:
          type: string
          title: شناسه رهگیری درگاه
          maxLength: 120
        error_message:
          type: string
          title: پیام خطا
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: تاریخ ایجاد
      required:
      - created_at
      - id
      - message_text
      - recipient_phone
    ServiceMetaResponse:
      type: object
      description: سریالایزر مستندسازی پاسخ متادیتای سرویس.
      properties:
        service:
          type: string
        title:
          type: string
        organizer:
          type: string
        schema_version:
          type: string
        today_jalali:
          type: string
        server_time_iso:
          type: string
        server_time_jalali:
          type: string
        timezone:
          type: string
      required:
      - organizer
      - schema_version
      - server_time_iso
      - server_time_jalali
      - service
      - timezone
      - title
      - today_jalali
    SeverityEnum:
      enum:
      - low
      - medium
      - high
      type: string
      description: |-
        * `low` - کم
        * `medium` - متوسط
        * `high` - بالا
    SignalTypeEnum:
      enum:
      - ip_change_during_exam
      - rapid_answering
      - excessive_otp_attempts
      - multi_device_conflict
      type: string
      description: |-
        * `ip_change_during_exam` - تغییر ناگهانی IP در حین آزمون
        * `rapid_answering` - پاسخ‌دهی غیرطبیعی و فوق‌سریع به سوالات
        * `excessive_otp_attempts` - تلاش‌های مکرر ناموفق OTP
        * `multi_device_conflict` - تلاش هم‌زمان از چند دستگاه
    StatusEnum:
      enum:
      - sent
      - failed
      type: string
      description: |-
        * `sent` - ارسال‌شده
        * `failed` - خطا در ارسال
    SubmitAnswerInputRequest:
      type: object
      description: قرارداد ثبت پاسخ یک سوال در حین آزمون (شماره سوال ۱ تا ۵ و شماره
        گزینه ۱ تا ۴).
      properties:
        question_number:
          type: integer
          maximum: 50
          minimum: 1
        selected_position:
          type: integer
          maximum: 4
          minimum: 1
      required:
      - question_number
      - selected_position
    TokenRefreshInputRequest:
      type: object
      description: درخواست تمدید توکن دسترسی با استفاده از توکن Refresh.
      properties:
        refresh:
          type: string
    UserProfileOutput:
      type: object
      description: سریالایزر خروجی پروفایل کاربر به همراه مسجد و وضعیت آمادگی ورود
        به آزمون.
      properties:
        id:
          type: integer
          readOnly: true
        first_name:
          type: string
          title: نام
          maxLength: 80
        last_name:
          type: string
          title: نام خانوادگی
          maxLength: 100
        full_name:
          type: string
          readOnly: true
        national_id:
          type: string
          title: کد ملی
          maxLength: 10
        phone_number:
          type: string
          title: شماره تماس
          maxLength: 15
        birth_date:
          type: string
          format: date
          nullable: true
          title: تاریخ تولد
        birth_date_jalali:
          type: string
          readOnly: true
        age:
          type: integer
          readOnly: true
        mosque:
          type: integer
          nullable: true
          title: مسجد انتخابی
        mosque_id:
          type: integer
          readOnly: true
        mosque_name:
          type: string
          nullable: true
          description: نام مسجد انتخاب‌شده توسط کاربر.
          readOnly: true
        mosque_code:
          type: string
          nullable: true
          description: کد مسجد انتخاب‌شده توسط کاربر.
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/UserProfileOutputRoleEnum'
          title: نقش کاربر
        is_phone_verified:
          type: boolean
          title: تأیید تلفن همراه
        mfa_enabled:
          type: boolean
          title: فعال بودن TOTP دومرحله‌ای
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: زمان ثبت‌نام
      required:
      - age
      - birth_date_jalali
      - created_at
      - first_name
      - full_name
      - id
      - last_name
      - mosque_code
      - mosque_id
      - mosque_name
      - national_id
      - phone_number
    UserProfileOutputRoleEnum:
      enum:
      - participant
      - operator
      - admin
      type: string
      description: |-
        * `participant` - شرکت‌کننده در مسابقه
        * `operator` - اپراتور / پشتیبان
        * `admin` - مدیر کل سامانه
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
