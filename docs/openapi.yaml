components:
  schemas:
    ActionEnum:
      enum:
      - user.registered
      - user.logged_in
      - user.updated
      - user.role_changed
      - session.revoked
      - mfa.enrolled
      - mfa.verified
      - risk.reviewed
      - mosque.created
      - mosque.updated
      - mosque.deleted
      - mosque.seeded
      - exam.config_updated
      - question.created
      - question.updated
      - question.deleted
      - exam.regraded
      - exam.started
      - exam.completed
      - exam.timed_out
      - report.exported
      - audit.exported
      type: string
      description: |-
        * `user.registered` - ثبت‌نام شرکت‌کننده
        * `user.logged_in` - ورود کاربر
        * `user.updated` - ویرایش اطلاعات کاربر
        * `user.role_changed` - تغییر نقش کاربر
        * `session.revoked` - ابطال نشست کاربری
        * `mfa.enrolled` - فعال‌سازی تأیید دومرحله‌ای
        * `mfa.verified` - تأیید دومرحله‌ای موفق
        * `risk.reviewed` - بررسی سیگنال ریسک امنیتی
        * `mosque.created` - ایجاد مسجد
        * `mosque.updated` - ویرایش مسجد
        * `mosque.deleted` - غیرفعال‌سازی مسجد
        * `mosque.seeded` - بارگذاری اولیه مساجد حوزه ۱۸۵
        * `exam.config_updated` - تغییر تنظیمات آزمون
        * `question.created` - ایجاد سوال در بانک سوال
        * `question.updated` - ویرایش سوال یا کلید
        * `question.deleted` - غیرفعال‌سازی سوال
        * `exam.regraded` - بازتصحیح کارنامه‌های آزمون
        * `exam.started` - شروع آزمون توسط شرکت‌کننده
        * `exam.completed` - پایان آزمون توسط شرکت‌کننده
        * `exam.timed_out` - اتمام مهلت زمانی آزمون
        * `report.exported` - خروجی اکسل گزارش شرکت‌کنندگان
        * `audit.exported` - خروجی بسته فارنزیک حسابرسی
