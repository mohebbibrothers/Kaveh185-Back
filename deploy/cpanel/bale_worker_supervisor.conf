; Kaveh185 — جای‌گزینِ systemd برای هاست‌های اشتراکی (اگر systemd نیست)
; cPanel → «Setup Python App» بعضی میزبان‌ها Supervisor دارد:
;   cp bale_worker_supervisor.conf ~/supervisord.conf.d/  (یا در supervisor.conf بگذارید)
; سپس:
;   supervisorctl reread && supervisorctl update
;   supervisorctl status bale_worker

[program:bale_worker]
command=/home/kavehir/virtualenv/Kaveh185-Back/3.12/bin/python manage.py bale_worker --quiet
directory=/home/kavehir/Kaveh185-Back
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=40
user=kavehir
stdout_logfile=/home/kavehir/kaveh185_bale.log
redirect_stderr=true
