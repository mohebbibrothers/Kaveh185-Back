name: Kaveh185 Enterprise CI Pipeline

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-security-and-tests:
    name: Quality, Security, OpenAPI Contract & Test Suite (Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip check

      - name: Verify dependency lockfiles (Zero Drift)
        run: python scripts/generate_locks.py --check

      - name: Verify STRUCTURE.md matches repository tree (Zero Drift)
        run: python scripts/generate_structure.py --check

      - name: Run Ruff Linter & Format Check
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Run Mypy Static Type Checker
        run: python -m mypy apps config manage.py

      - name: Run Bandit SAST Security Scanner
        run: python -m bandit -c pyproject.toml -r apps config manage.py -q

      - name: Run Dependency Vulnerability Audit (pip-audit)
        run: python -m pip_audit -r requirements.txt -r requirements-dev.txt --progress-spinner off

      - name: Run Django System, Production Deploy & Migration Checks
        run: |
          python manage.py check
          DJANGO_SETTINGS_MODULE=config.settings.production \
            DJANGO_SECRET_KEY=ci-prod-deploy-check-secret-key-9876543210-abcdef-1234567890-abcdef \
            python manage.py check --deploy --fail-level WARNING
          python manage.py makemigrations --check --dry-run

      - name: Validate OpenAPI 3.0 Schema Contract (Zero Warnings)
        run: python manage.py spectacular --validate --fail-on-warn --file /tmp/kaveh185-openapi.yaml

      - name: Run Pytest Suite with Coverage Gate (>= 90%)
        run: python -m pytest --cov=apps --cov-report=term-missing --cov-fail-under=90
